name: CI - Continuous Integration

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend CI (.NET 10 + xUnit Tests)
  # ==========================================
  backend-ci:
    name: Backend CI (Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('back-end/**/*.csproj', 'back-end/**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore back-end/VolunteerManagerment/VolunteerManagerment.slnx

      - name: Build Solution
        run: dotnet build back-end/VolunteerManagerment/VolunteerManagerment.slnx --configuration Release --no-restore

      - name: Run Backend Tests
        run: dotnet test back-end/VolunteerManagerment/VolunteerManagerment.Tests/VolunteerManagerment.Tests.csproj --configuration Release --no-build --verbosity normal

  # ==========================================
  # 2. Frontend CI (Node 22 + Vite + Vitest)
  # ==========================================
  frontend-ci:
    name: Frontend CI (Lint, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: front-end/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build Frontend
        run: pnpm build

name: CD - Deploy Frontend to Vercel

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'front-end/**'
      - '.github/workflows/deploy-frontend-vercel.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Vercel Secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Thiếu secret 'VERCEL_TOKEN'. Vui lòng vào GitHub Settings -> Secrets and variables -> Actions để thêm VERCEL_TOKEN."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Thiếu secret 'VERCEL_ORG_ID'. Vui lòng cấu hình VERCEL_ORG_ID."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Thiếu secret 'VERCEL_PROJECT_ID'. Vui lòng cấu hình VERCEL_PROJECT_ID."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: front-end/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Preview Deployment (for branches other than master/main, e.g. develop)
      - name: Pull Vercel Environment (Preview)
        if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        run: vercel pull --yes --environment=preview

      - name: Build Project Artifacts (Preview)
        if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        run: vercel build

      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        run: vercel deploy --prebuilt

      # Production Deployment (for master/main branch)
      - name: Pull Vercel Environment (Production)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production

      - name: Build Project Artifacts (Production)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: vercel build --prod

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod
